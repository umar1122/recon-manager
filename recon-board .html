<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recon Board</title>
<style>
  :root{
    --bg:#F5F6F1;
    --bg-soft:#EEEFE8;
    --panel:#FFFFFF;
    --border:#E1E3D9;
    --border-soft:#EBECE5;
    --ink:#1C2019;
    --ink-muted:#666A5B;
    --ink-faint:#9A9D8C;
    --accent:#0E7C6B;
    --accent-strong:#0A6255;
    --accent-soft:#E3F2EE;
    --amber:#B9790A;
    --amber-soft:#FBEEDA;
    --red:#C4432B;
    --red-soft:#FBE8E3;
    --blue:#2F6FA8;
    --blue-soft:#E6EFF7;
    --green:#2E8B57;
    --green-soft:#E5F3EA;
    --grey-soft:#EEEEE7;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, "Roboto Mono", monospace;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:14px;
    --shadow-card: 0 1px 2px rgba(30,35,25,0.04), 0 1px 8px rgba(30,35,25,0.03);
    --shadow-pop: 0 10px 30px rgba(20,25,18,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-strong); }
  *:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button, input, textarea, select{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  svg.icon{ flex:none; }
  code, .mono{ font-family:var(--mono); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  .app{ display:grid; grid-template-columns:308px 1fr; height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{ border-right:1px solid var(--border); background:var(--panel); display:flex; flex-direction:column; min-width:0; }
  .brand{ padding:20px 18px 14px; display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:34px; height:34px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; flex:none; }
  .brand-name{ font-size:15px; font-weight:700; letter-spacing:-0.01em; }
  .brand-sub{ font-size:11px; color:var(--ink-faint); margin-top:1px; }

  .sidebar-search{ padding:0 18px 12px; }
  .search-box{ position:relative; }
  .search-box svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-faint); }
  .search-box input{ width:100%; background:var(--bg-soft); border:1px solid var(--border); border-radius:var(--radius-md); padding:8px 10px 8px 32px; color:var(--ink); }
  .search-box input::placeholder{ color:var(--ink-faint); }

  .filter-chips{ display:flex; gap:6px; padding:0 18px 12px; flex-wrap:wrap; }
  .chip{ font-size:11.5px; padding:5px 10px; border-radius:20px; border:1px solid var(--border); background:var(--panel); color:var(--ink-muted); }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip:hover:not(.active){ border-color:var(--accent); color:var(--accent-strong); }

  .sidebar-actions{ padding:0 18px 14px; }
  .btn{
    background:var(--panel); border:1px solid var(--border); color:var(--ink);
    padding:8px 12px; border-radius:var(--radius-md); font-size:12.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  .btn-danger:hover{ border-color:var(--red); color:var(--red); background:var(--red-soft); }
  .btn-block{ width:100%; justify-content:center; }
  .btn-ghost{ background:transparent; border-color:transparent; }
  .btn-ghost:hover{ background:var(--bg-soft); border-color:transparent; color:var(--ink); }
  .btn-icon{ padding:7px; }
  .btn-sm{ padding:6px 10px; font-size:11.5px; }

  .program-list{ overflow-y:auto; flex:1; padding:0 12px 12px; }
  .program-card{
    padding:12px 12px; border-radius:var(--radius-md); border:1px solid transparent; margin-bottom:6px; cursor:pointer;
    display:flex; gap:10px; align-items:flex-start;
  }
  .program-card:hover{ background:var(--bg-soft); }
  .program-card.active{ background:var(--accent-soft); border-color:var(--accent); }
  .avatar{
    width:32px; height:32px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700; color:#fff;
  }
  .pc-body{ min-width:0; flex:1; }
  .pc-top{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .pc-name{ font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status-dot{ width:8px; height:8px; border-radius:50%; flex:none; box-shadow:0 0 0 3px var(--panel); }
  .status-active .status-dot{ background:var(--green); }
  .status-paused .status-dot{ background:var(--amber); }
  .status-completed .status-dot{ background:var(--blue); }
  .status-archived .status-dot{ background:var(--ink-faint); }
  .pc-meta{ font-size:11px; color:var(--ink-faint); margin-top:5px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pc-meta span{ display:inline-flex; align-items:center; gap:4px; }
  .mini-ring-wrap{ display:flex; align-items:center; gap:4px; }

  .empty-sidebar{ color:var(--ink-faint); font-size:12px; padding:20px 12px; text-align:center; }

  .sidebar-footer{
    padding:12px 18px 16px; border-top:1px solid var(--border-soft);
    display:flex; gap:8px;
  }

  /* ---------- Main ---------- */
  .main{ overflow-y:auto; min-width:0; background:var(--bg); }
  .main-inner{ max-width:960px; margin:0 auto; padding:28px 30px 70px; }

  /* Dashboard */
  .hero{ background:linear-gradient(135deg, var(--accent-soft), var(--panel) 70%); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px 32px; margin-bottom:24px; box-shadow:var(--shadow-card); }
  .hero-eyebrow{ display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; color:var(--accent-strong); background:var(--panel); border:1px solid var(--border); padding:4px 10px; border-radius:20px; margin-bottom:14px; }
  .hero-title{ font-size:32px; font-weight:800; letter-spacing:-0.02em; line-height:1.15; }
  .hero-desc{ font-size:13.5px; color:var(--ink-muted); margin-top:10px; max-width:560px; line-height:1.6; }
  .hero-actions{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .btn-lg{ padding:11px 18px; font-size:13px; border-radius:var(--radius-md); }

  .how-it-works{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
  .how-step{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow-card); }
  .how-step-num{ width:26px; height:26px; border-radius:8px; background:var(--accent-soft); color:var(--accent-strong); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
  .how-step-title{ font-size:13px; font-weight:700; margin-bottom:4px; }
  .how-step-desc{ font-size:12px; color:var(--ink-muted); line-height:1.5; }

  .dash-header{ margin-bottom:20px; }
  .dash-title{ font-size:22px; font-weight:800; letter-spacing:-0.01em; }
  .dash-sub{ font-size:13px; color:var(--ink-muted); margin-top:4px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
  .stat-card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow-card); }
  .stat-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .stat-icon{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .stat-value{ font-size:24px; font-weight:800; letter-spacing:-0.02em; }
  .stat-label{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .sev-mini-bar{ display:flex; height:6px; border-radius:4px; overflow:hidden; margin-top:10px; background:var(--grey-soft); }

  .section-label{ font-size:12px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.04em; margin:22px 0 10px; display:flex; align-items:center; gap:8px; }

  .grid-cards{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .grid-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px;
    cursor:pointer; box-shadow:var(--shadow-card); transition:transform .1s ease, box-shadow .1s ease;
  }
  .grid-card:hover{ transform:translateY(-1px); box-shadow:0 4px 16px rgba(20,25,18,0.08); border-color:var(--accent); }
  .grid-card-top{ display:flex; gap:10px; align-items:center; }
  .grid-card-name{ font-size:14px; font-weight:700; }
  .grid-card-platform{ font-size:11.5px; color:var(--ink-faint); }
  .grid-card-stats{ display:flex; gap:14px; margin-top:12px; font-size:11.5px; color:var(--ink-muted); }
  .grid-card-stats span{ display:inline-flex; align-items:center; gap:4px; }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--ink-faint); text-align:center; padding:60px 30px; background:var(--panel); border:1px dashed var(--border); border-radius:var(--radius-lg);
  }
  .empty-state .glyph{ width:52px; height:52px; border-radius:14px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .empty-state-title{ font-size:14.5px; color:var(--ink); font-weight:700; margin-bottom:5px; }
  .empty-state-sub{ max-width:340px; font-size:12.5px; margin-bottom:16px; }

  /* Program header */
  .program-header{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px; box-shadow:var(--shadow-card); }
  .program-header-left{ display:flex; gap:14px; align-items:center; min-width:0; }
  .program-title{ font-size:18px; font-weight:800; letter-spacing:-0.01em; }
  .program-title-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .badge{ font-size:10.5px; padding:3px 9px; border-radius:20px; border:1px solid var(--border); color:var(--ink-muted); font-weight:600; display:inline-flex; align-items:center; gap:4px; }
  .badge-status{ text-transform:capitalize; }
  .program-link{ font-size:12px; color:var(--blue); text-decoration:none; display:inline-flex; align-items:center; gap:4px; margin-top:4px; }
  .program-link:hover{ text-decoration:underline; }
  .program-header-actions{ display:flex; gap:6px; flex:none; align-items:center; }
  .ring-wrap{ position:relative; width:56px; height:56px; flex:none; }
  .ring-label{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--accent-strong); }

  .tabs{ display:flex; gap:4px; margin-bottom:18px; background:var(--bg-soft); padding:4px; border-radius:var(--radius-md); width:fit-content; }
  .tab{ padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--ink-muted); border-radius:8px; background:none; border:none; display:inline-flex; align-items:center; gap:6px; }
  .tab.active{ color:var(--accent-strong); background:var(--panel); box-shadow:var(--shadow-card); }
  .tab:hover:not(.active){ color:var(--ink); }

  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px; box-shadow:var(--shadow-card); }
  .panel + .panel{ margin-top:14px; }
  .panel-title{ font-size:12.5px; font-weight:700; color:var(--ink-muted); margin-bottom:12px; display:flex; align-items:center; gap:7px; }
  .meta-row{ display:flex; gap:18px; font-size:11.5px; color:var(--ink-faint); margin-top:14px; flex-wrap:wrap; }
  .meta-row span{ display:inline-flex; align-items:center; gap:5px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-muted); margin-bottom:6px; }
  .field input[type=text], .field input[type=url], .field textarea, .field select{
    width:100%; background:var(--bg-soft); border:1px solid var(--border); color:var(--ink);
    padding:9px 11px; border-radius:var(--radius-md);
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field input:focus, .field textarea:focus, .field select:focus{ background:var(--panel); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  .scope-cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .scope-box{ padding:12px; border-radius:var(--radius-md); }
  .scope-box.in{ background:var(--green-soft); }
  .scope-box.out{ background:var(--red-soft); }
  .scope-box-title{ font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .scope-box.in .scope-box-title{ color:var(--green); }
  .scope-box.out .scope-box-title{ color:var(--red); }
  .scope-box pre{ margin:0; white-space:pre-wrap; font-family:var(--mono); font-size:12px; color:var(--ink); }
  .scope-box .placeholder{ color:var(--ink-faint); font-family:var(--sans); font-size:12.5px; }

  /* Recon checklist */
  .progress-summary{ display:flex; align-items:center; gap:14px; margin-bottom:18px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 18px; box-shadow:var(--shadow-card); }
  .progress-bar{ flex:1; height:9px; background:var(--grey-soft); border-radius:6px; overflow:hidden; }
  .progress-bar-fill{ height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-strong)); transition:width .25s ease; }
  .progress-label{ font-size:12.5px; color:var(--ink-muted); font-weight:700; white-space:nowrap; }

  .phase{ border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:8px; overflow:hidden; background:var(--panel); box-shadow:var(--shadow-card); }
  .phase-head{ display:flex; align-items:center; gap:12px; padding:13px 16px; width:100%; text-align:left; border:none; background:none; }
  .phase-icon{ width:32px; height:32px; border-radius:9px; background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; flex:none; }
  .phase-title{ font-size:13.5px; font-weight:700; flex:1; }
  .phase-num{ font-size:10.5px; color:var(--ink-faint); font-family:var(--mono); }
  .phase-count{ font-size:11.5px; color:var(--ink-faint); font-weight:600; flex:none; }
  .phase-ring{ flex:none; }
  .phase-chevron{ color:var(--ink-faint); flex:none; transition:transform .12s ease; }
  .phase.open .phase-chevron{ transform:rotate(90deg); }
  .phase-body{ display:none; padding:2px 16px 14px 60px; }
  .phase.open .phase-body{ display:block; }
  .check-item{ display:flex; align-items:flex-start; gap:10px; padding:7px 0; font-size:12.5px; border-top:1px solid var(--border-soft); }
  .check-item:first-child{ border-top:none; }
  .check-item input{ margin-top:3px; accent-color:var(--accent); width:15px; height:15px; }
  .check-item.checked label{ color:var(--ink-faint); text-decoration:line-through; }
  .check-item label{ cursor:pointer; }
  .phase-notes{ margin:12px 0 6px; }
  .phase-notes-label{ font-size:11px; font-weight:700; color:var(--ink-muted); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .phase-notes textarea{
    width:100%; min-height:76px; background:var(--bg-soft); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:9px 11px; color:var(--ink); font-family:var(--mono); font-size:12px; resize:vertical; line-height:1.5;
  }
  .phase-notes textarea:focus{ background:var(--panel); }
  .phase-notes-hint{ font-size:10.5px; color:var(--ink-faint); margin-top:5px; }
  .phase-notes-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .phase-notes-actions{ display:flex; gap:5px; }
  .phase-notes textarea{ min-height:110px; }
  .phase-output-count{ font-size:10.5px; color:var(--ink-faint); }
  .phase-saved{ font-size:10.5px; color:var(--green); opacity:0; transition:opacity .15s ease; }
  .phase-saved.show{ opacity:1; }

  /* Findings */
  .findings-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .sev-legend{ display:flex; gap:10px; flex-wrap:wrap; }
  .sev-legend span{ font-size:11px; color:var(--ink-faint); display:inline-flex; align-items:center; gap:5px; }
  .sev-dot{ width:8px; height:8px; border-radius:50%; }
  .finding-card{ border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:8px; background:var(--panel); box-shadow:var(--shadow-card); }
  .finding-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .finding-title-row{ display:flex; align-items:center; gap:9px; }
  .finding-sev-icon{ width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; }
  .finding-title{ font-size:13.5px; font-weight:700; }
  .finding-meta{ font-size:11px; color:var(--ink-faint); margin-top:5px; display:flex; gap:10px; flex-wrap:wrap; margin-left:37px; }
  .finding-meta span{ display:inline-flex; align-items:center; gap:4px; }
  .finding-notes{ font-size:12px; color:var(--ink-muted); margin-top:10px; margin-left:37px; white-space:pre-wrap; background:var(--bg-soft); padding:10px 12px; border-radius:var(--radius-md); }
  .finding-actions{ display:flex; gap:6px; flex:none; }
  .sev-badge{ font-size:10px; padding:2px 8px; border-radius:20px; font-weight:700; letter-spacing:0.02em; text-transform:capitalize; }
  .sev-critical{ background:var(--red-soft); color:var(--red); }
  .sev-high{ background:var(--red-soft); color:var(--red); }
  .sev-medium{ background:var(--amber-soft); color:var(--amber); }
  .sev-low{ background:var(--blue-soft); color:var(--blue); }
  .sev-info{ background:var(--grey-soft); color:var(--ink-muted); }
  .status-pill{ font-size:10px; padding:2px 8px; border-radius:20px; border:1px solid var(--border); color:var(--ink-muted); text-transform:capitalize; }
  .empty-findings{ color:var(--ink-faint); font-size:12.5px; padding:24px 4px; text-align:center; }

  /* Overlay form */
  .overlay{ position:fixed; inset:0; background:rgba(20,24,17,0.35); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50; }
  .overlay-panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); width:100%; max-width:580px; padding:24px; box-shadow:var(--shadow-pop); }
  .overlay-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .overlay-title{ font-size:16px; font-weight:800; display:flex; align-items:center; gap:9px; }
  .overlay-title-icon{ width:32px; height:32px; border-radius:9px; background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; }
  .overlay-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  .import-hint{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--accent-soft); border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 12px; margin-bottom:18px; font-size:12px; color:var(--ink); }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:var(--radius-md); font-size:12.5px; z-index:80; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow-pop); }

  .mobile-topbar{ display:none; }

  @media (max-width: 900px){
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
    .grid-cards{ grid-template-columns:1fr; }
    .how-it-works{ grid-template-columns:1fr; }
  }
  @media (max-width: 780px){
    .app{ grid-template-columns:1fr; }
    .sidebar{ position:fixed; inset:0 15% 0 0; z-index:40; transform:translateX(-105%); transition:transform .15s ease; }
    body.sidebar-open .sidebar{ transform:translateX(0); }
    .mobile-topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--panel); }
    .main-inner{ padding:18px 16px 60px; }
    .field-row, .field-row3, .scope-cols{ grid-template-columns:1fr; }
    .stat-grid{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>

<div class="mobile-topbar">
  <button class="btn btn-ghost btn-sm" id="menuToggle"></button>
  <span style="font-size:12.5px;font-weight:700;" id="mobileTitle">Recon Board</span>
  <span style="width:24px;"></span>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none;">

<script>
(function(){
  "use strict";

  /* ---------------- Icon library (built from primitives, no external deps) ---------------- */
  var ICONS = {

    edit: '<path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><line x1="13.3" y1="6.7" x2="17.3" y2="10.7"/>',
    trash: '<polyline points="4,7 20,7"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
    download: '<path d="M12 3v12"/><polyline points="7,10.5 12,15.5 17,10.5"/><path d="M5 19h14"/>',

    external: '<rect x="4" y="4" width="10" height="10" rx="1.5"/><path d="M10 4h10v10"/><line x1="20" y1="4" x2="10" y2="14"/>',
    chevron: '<polyline points="9,6 15,12 9,18"/>',
    x: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
    check: '<polyline points="5,13 10,18 19,7"/>',
    search: '<circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="20" y2="20"/>',
    menu: '<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>',
    shield: '<path d="M12 3l7 3v6c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V6l7-3z"/>',
    bug: '<circle cx="12" cy="13" r="5"/><line x1="12" y1="8" x2="12" y2="5"/><line x1="9" y1="4" x2="12" y2="5"/><line x1="15" y1="4" x2="12" y2="5"/><line x1="7" y1="12" x2="4" y2="11"/><line x1="7" y1="15" x2="4" y2="17"/><line x1="17" y1="12" x2="20" y2="11"/><line x1="17" y1="15" x2="20" y2="17"/>',
    target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
    building: '<rect x="5" y="4" width="14" height="16" rx="1"/><line x1="9" y1="8" x2="9.01" y2="8"/><line x1="15" y1="8" x2="15.01" y2="8"/><line x1="9" y1="12" x2="9.01" y2="12"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/>',
    globe: '<circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="3.4" ry="8"/><line x1="4" y1="12" x2="20" y2="12"/>',
    camera: '<path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/>',
    link2: '<path d="M9.5 14.5l5-5"/><path d="M8 12.5l-1.8 1.8a3.3 3.3 0 0 0 4.7 4.7l1.8-1.8"/><path d="M16 11.5l1.8-1.8a3.3 3.3 0 0 0-4.7-4.7l-1.8 1.8"/>',
    sliders: '<line x1="5" y1="6" x2="19" y2="6"/><circle cx="14" cy="6" r="1.7"/><line x1="5" y1="12" x2="19" y2="12"/><circle cx="8" cy="12" r="1.7"/><line x1="5" y1="18" x2="19" y2="18"/><circle cx="16" cy="18" r="1.7"/>',
    folder: '<path d="M4 7a1 1 0 0 1 1-1h4l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7z"/>',
    book: '<path d="M12 6.5c-1.5-1.2-4-1.5-8-1v13c4-0.5 6.5-0.2 8 1 1.5-1.2 4-1.5 8-1v-13c-4-0.5-6.5-0.2-8 1z"/><line x1="12" y1="6.5" x2="12" y2="19.5"/>',
    terminal: '<rect x="3" y="4" width="18" height="16" rx="2"/><polyline points="7,9.5 10.5,12.5 7,15.5"/><line x1="12.5" y1="15.5" x2="16.5" y2="15.5"/>',
    alert: '<path d="M12 4l9 15H3z"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    home: '<path d="M4 11l8-6 8 6"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/>',
    calendar: '<rect x="4" y="6" width="16" height="14" rx="2"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8" y1="4" x2="8" y2="7"/><line x1="16" y1="4" x2="16" y2="7"/>',
    dollar: '<line x1="12" y1="3" x2="12" y2="21"/><path d="M17 7.5c0-1.7-2-2.5-5-2.5s-5 1-5 3 2 2.7 5 3 5 1.3 5 3-2 3-5 3-5-1-5-2.5"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>',
    checkCircle: '<circle cx="12" cy="12" r="8.5"/><polyline points="8.2,12.3 10.7,14.8 15.8,9.2"/>',
    xCircle: '<circle cx="12" cy="12" r="8.5"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><polyline points="12,7 12,12 15.5,14"/>',
    inbox: '<path d="M4 13l2-8h12l2 8"/><path d="M4 13v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6"/><path d="M4 13h5l1.3 2.5h3.4L15 13h5"/>',
    clipboard: '<rect x="6" y="4" width="12" height="16" rx="2"/><rect x="9" y="2.2" width="6" height="3.6" rx="1"/><line x1="9" y1="10.5" x2="15" y2="10.5"/><line x1="9" y1="14" x2="15" y2="14"/>'
  };
  function icon(name, size, extraClass){
    var d = ICONS[name] || "";
    return '<svg class="icon '+(extraClass||"")+'" width="'+(size||16)+'" height="'+(size||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
  }
  function ring(pct, size, stroke, color, bg){
    size = size || 56; stroke = stroke || 5;
    var r = (size - stroke) / 2;
    var c = 2 * Math.PI * r;
    var offset = c - (pct/100) * c;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
      + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(bg||"var(--grey-soft)")+'" stroke-width="'+stroke+'"/>'
      + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(color||"var(--accent)")+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'
      + '</svg>';
  }

  var PLATFORM_COLORS = {
    "HackerOne":"#5B4FE0", "Bugcrowd":"#E8622C", "Intigriti":"#0B5FFF",
    "YesWeHack":"#101828", "Synack":"#C4432B", "Private / VDP":"#2E8B57", "Other":"#6B6F62"
  };
  function platformInitials(p){
    if(p === "Private / VDP") return "VDP";
    var parts = p.replace(/[^A-Za-z ]/g,"").split(" ").filter(Boolean);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[1][0]).toUpperCase();
  }

  /* ---------------- Recon template ---------------- */
  var RECON_TEMPLATE = [
    { id:"acquisitions", title:"Acquisitions", icon:"building", items:[
      { id:"crunchbase", label:"Check Crunchbase for parent companies, acquisitions & subsidiaries" }
    ]},
    { id:"subdomains", title:"Find subdomains", icon:"globe", items:[
      { id:"cert-logs", label:"Cert-log / SSL probing (cero, tlsx, hakip2host, prips, crt.sh, CTFR)" },
      { id:"csp-cname-vhost", label:"CSP probing, CNAME probing, vhost probing, web probing" },
      { id:"asn-discovery", label:"Find ASNs (bgp.he.net, ASNLookup) then amass intel -active -asn" },
      { id:"horizontal-enum", label:"Horizontal enumeration: IP space, related domains, PTR/reverse DNS, favicon hashing" },
      { id:"vertical-enum", label:"Vertical enumeration: amass, assetfinder, subfinder, findomain" },
      { id:"recursive-enum", label:"Recursive enumeration on newly found subdomains" },
      { id:"dns-bruteforce", label:"DNS bruteforce / permutation / alterations + dnsvalidator" },
      { id:"js-scraping-subs", label:"Scrape JS / source (Gospider) for hidden subdomains" }
    ]},
    { id:"live-subs", title:"Live subdomains", icon:"camera", items:[
      { id:"screenshot", label:"Screenshot all live hosts" },
      { id:"wafwoof", label:"Fingerprint WAF (wafw00f)" },
      { id:"cmseek", label:"Identify CMS (CMSeek)" }
    ]},
    { id:"search-engines", title:"Internet search engines", icon:"search", items:[
      { id:"shodan", label:"Shodan.io sweep" },
      { id:"censys", label:"Censys.io sweep" },
      { id:"fofa", label:"Fofa.so sweep" }
    ]},
    { id:"url-extraction", title:"URL extraction", icon:"link2", items:[
      { id:"crawlers", label:"Crawl with gospider / hakrawler" },
      { id:"gau-wayback", label:"gau / waybackurls / waymore" },
      { id:"github-endpoints", label:"github-endpoints search" },
      { id:"roboxtractor", label:"robots.txt extraction (roboxtractor)" },
      { id:"gf-filtering", label:"Filter URLs with gf patterns" },
      { id:"js-files", label:"Pull all JS files & mine them (xnLinkFinder, jsleak, jsfinder, JSA.py)" }
    ]},
    { id:"hidden-params", title:"Hidden parameters", icon:"sliders", items:[
      { id:"arjun", label:"Arjun parameter discovery" },
      { id:"paramspider", label:"Paramspider" },
      { id:"apkleaks", label:"APKLeaks (mobile app secrets)" }
    ]},
    { id:"content-discovery", title:"Content discovery", icon:"folder", items:[
      { id:"ffuf", label:"ffuf brute forcing" },
      { id:"feroxbuster", label:"FeroxBuster" },
      { id:"waybackmachine", label:"Waybackmachine review" }
    ]},
    { id:"wordlists", title:"Wordlists", icon:"book", items:[
      { id:"assetnote", label:"Pull relevant lists from wordlists.assetnote.io" },
      { id:"seclists", label:"Seclists / jhaddix-all / six2dex" },
      { id:"custom-wordlist", label:"Build a custom target-specific wordlist" },
      { id:"scavenger-cewl", label:"Generate wordlist with Scavenger / Cewl" }
    ]},
    { id:"dorking", title:"Dorking", icon:"terminal", items:[
      { id:"google-dork", label:"Google dorking" },
      { id:"github-dork", label:"GitHub dorking" }
    ]}
  ];

  var BUG_CATEGORIES = ["Open Redirect","XSS","Host Header Injection","IDOR","CSRF","SQL Injection",
    "SSRF","XXE","Auth Bypass","Broken Access Control","File Upload","Login/Brute Force","Other"];

  var SEV_COLORS = { critical:"var(--red)", high:"var(--red)", medium:"var(--amber)", low:"var(--blue)", info:"var(--ink-faint)" };
  var SEV_SOFT = { critical:"var(--red-soft)", high:"var(--red-soft)", medium:"var(--amber-soft)", low:"var(--blue-soft)", info:"var(--grey-soft)" };

  var STORAGE_KEY = "reconboard_data_v1";

  /* ---------------- State ---------------- */
  var state = {
    programs: [],
    selectedId: null,
    tab: "overview",
    openPhases: {},
    search: "",
    statusFilter: "all"
  };

  function uid(){ return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,9); }

  function freshRecon(){
    var r = {};
    RECON_TEMPLATE.forEach(function(phase){
      r[phase.id] = {};
      phase.items.forEach(function(item){ r[phase.id][item.id] = false; });
    });
    return r;
  }
  function freshReconNotes(){
    var r = {};
    RECON_TEMPLATE.forEach(function(phase){ r[phase.id] = ""; });
    return r;
  }

  function blankProgram(){
    return {
      id: uid(), name: "", platform: "HackerOne", url: "", status: "active", payout: "",
      scopeIn: "", scopeOut: "", notes: "", recon: freshRecon(), reconNotes: freshReconNotes(), findings: [],
      createdAt: Date.now(), updatedAt: Date.now()
    };
  }
  function blankFinding(){
    return { id: uid(), title: "", category: "Other", severity: "medium", status: "draft", endpoint: "", bounty: "", notes: "", createdAt: Date.now() };
  }

  /* ---------------- Persistence ---------------- */
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify({ version:1, programs: state.programs })); }
  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ state.programs = (JSON.parse(raw).programs) || []; }
    }catch(e){ state.programs = []; }
    state.programs.forEach(function(p){
      if(!p.reconNotes) p.reconNotes = freshReconNotes();
    });
  }

  function toast(msg, iconName){
    var existing = document.querySelector(".toast");
    if(existing) existing.remove();
    var t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = icon(iconName || "check", 15) + '<span>'+esc(msg)+'</span>';
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtDate(ts){
    var d = new Date(ts);
    return d.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
  }

  function getSelected(){ return state.programs.find(function(p){ return p.id === state.selectedId; }) || null; }

  function reconProgress(program){
    var total = 0, done = 0;
    RECON_TEMPLATE.forEach(function(phase){
      phase.items.forEach(function(item){ total++; if(program.recon[phase.id] && program.recon[phase.id][item.id]) done++; });
    });
    return { total: total, done: done, pct: total ? Math.round((done/total)*100) : 0 };
  }

  function severityCounts(findings){
    var c = { critical:0, high:0, medium:0, low:0, info:0 };
    findings.forEach(function(f){ if(c[f.severity] !== undefined) c[f.severity]++; });
    return c;
  }

  /* ---------------- Static chrome ---------------- */
  function renderChrome(){
    document.getElementById("brandMark").innerHTML = icon("shield", 18);
    document.getElementById("searchIcon").outerHTML = icon("search", 15, "");
    document.getElementById("newProgramBtn").innerHTML = icon("plus", 15) + " New program";
    document.getElementById("exportAllBtn").innerHTML = icon("download", 14) + " Export";
    document.getElementById("importBtn").innerHTML = icon("upload", 14) + " Import";
    document.getElementById("menuToggle").innerHTML = icon("menu", 18);
  }

  /* ---------------- Rendering: sidebar ---------------- */
  function renderFilterChips(){
    var counts = { all: state.programs.length, active:0, paused:0, completed:0, archived:0 };
    state.programs.forEach(function(p){ counts[p.status] = (counts[p.status]||0) + 1; });
    var chips = [["all","All"],["active","Active"],["paused","Paused"],["completed","Done"]];
    var el = document.getElementById("filterChips");
    el.innerHTML = chips.map(function(c){
      return '<button class="chip'+(state.statusFilter===c[0]?' active':'')+'" data-filter="'+c[0]+'">'+c[1]+' · '+(counts[c[0]]||0)+'</button>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".chip"), function(b){
      b.addEventListener("click", function(){ state.statusFilter = b.getAttribute("data-filter"); renderSidebar(); });
    });
  }

  function filteredPrograms(){
    var q = state.search.trim().toLowerCase();
    return state.programs.filter(function(p){
      if(state.statusFilter !== "all" && p.status !== state.statusFilter) return false;
      if(q && p.name.toLowerCase().indexOf(q) === -1 && p.platform.toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  }

  function renderSidebar(){
    renderFilterChips();
    var list = document.getElementById("programList");
    var items = filteredPrograms();
    if(state.programs.length === 0){
      list.innerHTML = '<div class="empty-sidebar">'+icon("inbox",26)+'<div style="margin-top:8px;">No programs yet.<br>Add your first target to start tracking.</div></div>';
      return;
    }
    if(items.length === 0){
      list.innerHTML = '<div class="empty-sidebar">No programs match your search.</div>';
      return;
    }
    list.innerHTML = items.map(function(p){
      var prog = reconProgress(p);
      var active = p.id === state.selectedId ? " active" : "";
      var col = PLATFORM_COLORS[p.platform] || PLATFORM_COLORS.Other;
      return '<div class="program-card status-'+p.status+active+'" data-id="'+p.id+'">'
        + '<div class="avatar" style="background:'+col+';">'+platformInitials(p.platform)+'</div>'
        + '<div class="pc-body">'
        +   '<div class="pc-top">'
        +     '<span class="pc-name">'+esc(p.name || "Untitled program")+'</span>'
        +     '<span class="status-dot" title="'+p.status+'"></span>'
        +   '</div>'
        +   '<div class="pc-meta">'
        +     '<span>'+icon("bug",12)+' '+p.findings.length+'</span>'
        +     '<span class="mini-ring-wrap">'+ring(prog.pct,16,3,"var(--accent)")+' '+prog.pct+'%</span>'
        +   '</div>'
        + '</div>'
      + '</div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll(".program-card"), function(el){
      el.addEventListener("click", function(){
        state.selectedId = el.getAttribute("data-id");
        state.tab = "overview";
        closeMobileSidebar();
        render();
      });
    });
  }

  /* ---------------- Rendering: main ---------------- */
  function renderMain(){
    var main = document.getElementById("main");
    var p = getSelected();
    document.getElementById("mobileTitle").textContent = p ? (p.name || "Untitled program") : "Recon Board";

    if(!p){
      main.innerHTML = '<div class="main-inner">' + renderDashboard() + '</div>';
      bindDashboardEvents();
      return;
    }

    var prog = reconProgress(p);
    var col = PLATFORM_COLORS[p.platform] || PLATFORM_COLORS.Other;

    var html = '';
    html += '<div class="program-header">';
    html +=   '<div class="program-header-left">';
    html +=     '<div class="avatar" style="width:44px;height:44px;border-radius:12px;font-size:14px;background:'+col+';">'+platformInitials(p.platform)+'</div>';
    html +=     '<div>';
    html +=       '<div class="program-title-row">';
    html +=         '<div class="program-title">'+esc(p.name || "Untitled program")+'</div>';
    html +=         '<span class="badge badge-status status-'+p.status+'">'+icon("check", 11)+'<span class="status-dot" style="box-shadow:none;"></span>'+p.status+'</span>';
    html +=       '</div>';
    html +=       (p.url ? '<a class="program-link" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+icon("external",12)+' '+esc(p.url.replace(/^https?:\/\//,''))+'</a>' : '<div class="program-link" style="color:var(--ink-faint);">'+icon("external",12)+' no URL set</div>');
    html +=     '</div>';
    html +=   '</div>';
    html +=   '<div class="program-header-actions">';
    html +=     '<div class="ring-wrap">'+ring(prog.pct,56,5,"var(--accent)")+'<div class="ring-label">'+prog.pct+'%</div></div>';
    html +=     '<button class="btn btn-sm btn-icon" id="editProgramBtn" title="Edit program">'+icon("edit",15)+'</button>';
    html +=     '<button class="btn btn-sm btn-icon btn-danger" id="deleteProgramBtn" title="Delete program">'+icon("trash",15)+'</button>';
    html +=   '</div>';
    html += '</div>';

    html += '<div class="tabs">';
    html +=   '<button class="tab'+(state.tab==="overview"?' active':'')+'" data-tab="overview">'+icon("home",14)+' Overview</button>';
    html +=   '<button class="tab'+(state.tab==="recon"?' active':'')+'" data-tab="recon">'+icon("shield",14)+' Recon <span class="mono" style="font-size:10.5px;">'+prog.done+'/'+prog.total+'</span></button>';
    html +=   '<button class="tab'+(state.tab==="findings"?' active':'')+'" data-tab="findings">'+icon("bug",14)+' Findings <span class="mono" style="font-size:10.5px;">'+p.findings.length+'</span></button>';
    html += '</div>';

    if(state.tab === "overview") html += renderOverview(p);
    if(state.tab === "recon") html += renderRecon(p, prog);
    if(state.tab === "findings") html += renderFindings(p);

    main.innerHTML = '<div class="main-inner">'+html+'</div>';
    bindMainEvents(p);
  }

  function renderDashboard(){
    var total = state.programs.length;
    var active = state.programs.filter(function(p){ return p.status === "active"; }).length;
    var allFindings = [];
    state.programs.forEach(function(p){ allFindings = allFindings.concat(p.findings); });
    var sev = severityCounts(allFindings);
    var avgPct = total ? Math.round(state.programs.reduce(function(s,p){ return s + reconProgress(p).pct; },0) / total) : 0;

    var h = '';

  function statCard(iconName, color, value, label, extra){
    return '<div class="stat-card">'
      + '<div class="stat-card-top"><div class="stat-icon" style="background:'+color+'22;color:'+color+';">'+icon(iconName,16)+'</div></div>'

  function sevBar(sev, total){
    if(!total) return '';
    var order = ["critical","high","medium","low","info"];
    var colors = { critical:"var(--red)", high:"#DD8266", medium:"var(--amber)", low:"var(--blue)", info:"var(--ink-faint)" };
    var bars = order.map(function(k){
      var w = (sev[k]/total)*100;
      if(w <= 0) return '';
      return '<div style="width:'+w+'%;background:'+colors[k]+';" title="'+k+': '+sev[k]+'"></div>';
    }).join("");
    return '<div class="sev-mini-bar">'+bars+'</div>';
  }

  function renderRecon(p, prog){
    var h = '<div class="progress-summary">'
      + ring(prog.pct, 40, 4.5, "var(--accent)")
      + '<div style="flex:1;"><div class="progress-bar"><div class="progress-bar-fill" style="width:'+prog.pct+'%;"></div></div></div>'
      + '<div class="progress-label">'+prog.done+' / '+prog.total+' done</div>'
    + '</div>';
    RECON_TEMPLATE.forEach(function(phase, idx){
      var doneCount = 0;
      phase.items.forEach(function(item){ if(p.recon[phase.id][item.id]) doneCount++; });
      var phasePct = Math.round((doneCount/phase.items.length)*100);
      var isOpen = !!state.openPhases[phase.id];
      h += '<div class="phase'+(isOpen?' open':'')+'" data-phase="'+phase.id+'">';
      h += '<button class="phase-head" data-toggle-phase="'+phase.id+'">';
      h += '<div class="phase-icon">'+icon(phase.icon,16)+'</div>';
      h += '<div style="flex:1;"><span class="phase-title">'+esc(phase.title)+'</span> <span class="phase-num">0x0'+(idx+1)+'</span></div>';
      h += '<div class="phase-ring">'+ring(phasePct,26,3.5,doneCount===phase.items.length && phase.items.length ? "var(--green)" : "var(--accent)")+'</div>';
      h += '<span class="phase-count">'+doneCount+'/'+phase.items.length+'</span>';
      h += '<span class="phase-chevron">'+icon("chevron",16)+'</span>';
      h += '</button>';
      h += '<div class="phase-body">';
      phase.items.forEach(function(item){
        var checked = !!p.recon[phase.id][item.id];
        var cid = phase.id+"__"+item.id;
        h += '<div class="check-item'+(checked?' checked':'')+'">';
        h += '<input type="checkbox" id="'+cid+'" data-phase="'+phase.id+'" data-item="'+item.id+'" '+(checked?'checked':'')+'>';
        h += '<label for="'+cid+'">'+esc(item.label)+'</label>';
        h += '</div>';
      });
      var noteVal = (p.reconNotes && p.reconNotes[phase.id]) || "";
      h += '<div class="phase-notes">';
      h +=   '<div class="phase-notes-toolbar">';
      h +=     '<div class="phase-notes-label" style="margin:0;">'+icon("clipboard",13)+' Evidence / output log</div>';
      h +=     '<div class="phase-notes-actions">';
      h +=       '<span class="phase-output-count" data-output-count="'+phase.id+'">'+(noteVal ? noteVal.length : 0)+' chars</span>';
      h +=       '<span class="phase-saved" data-phase-saved="'+phase.id+'">Saved</span>';
      h +=       '<button class="btn btn-ghost btn-sm" type="button" data-stamp-phase="'+phase.id+'" title="Add current timestamp">'+icon("clock",12)+' Stamp</button>';
      h +=       '<button class="btn btn-ghost btn-sm" type="button" data-copy-phase="'+phase.id+'" title="Copy this phase output">'+icon("copy",12)+' Copy</button>';
      h +=     '</div>';
      h +=   '</div>';
      h +=   '<textarea data-phase-notes="'+phase.id+'" placeholder="Paste everything produced by this phase here — subdomains, IPs, ASNs, URLs, JS findings, screenshots, commands/results, notes, etc. This stays attached to this phase and is included in JSON exports.">'+esc(noteVal)+'</textarea>';
      h +=   '<div class="phase-notes-hint">Saved automatically as you type. Use Stamp for a timestamped entry; use Copy to move the complete phase output elsewhere.</div>';
      h += '</div>';
      h += '</div></div>';
    });
    return h;
  }

  function renderFindings(p){

  /* ---------------- Events within main ---------------- */
  function bindMainEvents(p){
    var main = document.getElementById("main");

    Array.prototype.forEach.call(main.querySelectorAll(".tab"), function(el){
      el.addEventListener("click", function(){ state.tab = el.getAttribute("data-tab"); render(); });
    });

    var editBtn = document.getElementById("editProgramBtn");
    if(editBtn) editBtn.addEventListener("click", function(){ openProgramForm(p); });

    var delBtn = document.getElementById("deleteProgramBtn");
    if(delBtn) delBtn.addEventListener("click", function(){
      if(confirm('Delete "'+(p.name||"this program")+'" and all its findings? This cannot be undone.')){
        state.programs = state.programs.filter(function(x){ return x.id !== p.id; });
        state.selectedId = null;
        save(); render();
        toast("Program deleted", "trash");
      }
    });

    Array.prototype.forEach.call(main.querySelectorAll("[data-toggle-phase]"), function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-toggle-phase");
        state.openPhases[id] = !state.openPhases[id];
        render();
      });
    });

    Array.prototype.forEach.call(main.querySelectorAll('input[type=checkbox][data-phase]'), function(el){
      el.addEventListener("change", function(){
        var phase = el.getAttribute("data-phase");
        var item = el.getAttribute("data-item");
        p.recon[phase][item] = el.checked;
        p.updatedAt = Date.now();
        save();
        render();
      });
    });

    var noteSaveTimers = {};
    Array.prototype.forEach.call(main.querySelectorAll('textarea[data-phase-notes]'), function(el){
      el.addEventListener("input", function(){
        var phase = el.getAttribute("data-phase-notes");
        if(!p.reconNotes) p.reconNotes = freshReconNotes();
        p.reconNotes[phase] = el.value;
        p.updatedAt = Date.now();
        clearTimeout(noteSaveTimers[phase]);
        noteSaveTimers[phase] = setTimeout(save, 300);
      });
    });

    Array.prototype.forEach.call(main.querySelectorAll('[data-stamp-phase]'), function(btn){
      btn.addEventListener("click", function(){
        var phase = btn.getAttribute("data-stamp-phase");
        var area = main.querySelector('textarea[data-phase-notes="'+phase+'"]');
        if(!area) return;
        var stamp = "[" + new Date().toLocaleString() + "] ";
        area.value += (area.value && !/\n$/.test(area.value) ? "\n" : "") + stamp;
        area.focus();
        area.dispatchEvent(new Event("input", {bubbles:true}));
      });
    });

    Array.prototype.forEach.call(main.querySelectorAll('[data-copy-phase]'), function(btn){
      btn.addEventListener("click", function(){
        var phase = btn.getAttribute("data-copy-phase");
        var area = main.querySelector('textarea[data-phase-notes="'+phase+'"]');
        if(!area) return;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(area.value).then(function(){ toast("Phase output copied", "copy"); }).catch(function(){ area.select(); document.execCommand("copy"); toast("Phase output copied", "copy"); });
        }else{
          area.select(); document.execCommand("copy"); toast("Phase output copied", "copy");
        }
      });
    });

    Array.prototype.forEach.call(main.querySelectorAll('textarea[data-phase-notes]'), function(el){
      el.addEventListener("input", function(){
        var phase = el.getAttribute("data-phase-notes");
        var count = main.querySelector('[data-output-count="'+phase+'"]');
        var saved = main.querySelector('[data-phase-saved="'+phase+'"]');
        if(count) count.textContent = el.value.length + " chars";
        if(saved){ saved.classList.add("show"); clearTimeout(saved._timer); saved._timer = setTimeout(function(){ saved.classList.remove("show"); }, 900); }
      });
    });

    var newFindingBtn = document.getElementById("newFindingBtn");
    if(newFindingBtn) newFindingBtn.addEventListener("click", function(){ openFindingForm(p, blankFinding()); });

    Array.prototype.forEach.call(main.querySelectorAll("[data-edit-finding]"), function(el){
      el.addEventListener("click", function(){
        var fid = el.getAttribute("data-edit-finding");
        var f = p.findings.find(function(x){ return x.id === fid; });
        if(f) openFindingForm(p, f);
      });
    });

    Array.prototype.forEach.call(main.querySelectorAll("[data-delete-finding]"), function(el){
      el.addEventListener("click", function(){
        var fid = el.getAttribute("data-delete-finding");
        if(confirm("Delete this finding?")){
          p.findings = p.findings.filter(function(x){ return x.id !== fid; });
          p.updatedAt = Date.now();
          save(); render();
        }
      });
    });
  }

      + '</div>'

    if(importShortcut) importShortcut.addEventListener("click", function(){
      close();
      document.getElementById("importFile").click();
    });
    document.getElementById("f-save").addEventListener("click", function(){
      draft.name = document.getElementById("f-name").value.trim();
      draft.platform = document.getElementById("f-platform").value;
      draft.status = document.getElementById("f-status").value;
      draft.url = document.getElementById("f-url").value.trim();
      draft.scopeIn = document.getElementById("f-scopein").value;

      else{ var idx = state.programs.findIndex(function(x){ return x.id === draft.id; }); state.programs[idx] = draft; }
      save();
      close();
      render();
      toast(isNew ? "Program created" : "Program updated", "check");
    });
  }

    function close(){ overlay.remove(); }
    overlay.addEventListener("click", function(e){ if(e.target === overlay) close(); });
    document.getElementById("ff-close").addEventListener("click", close);
    document.getElementById("ff-cancel").addEventListener("click", close);
    document.getElementById("ff-save").addEventListener("click", function(){
      draft.title = document.getElementById("ff-title").value.trim() || "Untitled finding";
      draft.category = document.getElementById("ff-category").value;
      draft.severity = document.getElementById("ff-severity").value;
      draft.status = document.getElementById("ff-status").value;
      draft.endpoint = document.getElementById("ff-endpoint").value.trim();
      draft.bounty = document.getElementById("ff-bounty").value.trim();
      draft.notes = document.getElementById("ff-notes").value;

      if(isNew){ program.findings.push(draft); }
      else{ var idx = program.findings.findIndex(function(x){ return x.id === draft.id; }); program.findings[idx] = draft; }
      program.updatedAt = Date.now();
      save();
      close();
      render();
      toast(isNew ? "Finding added" : "Finding updated", "check");
    });
  }

  /* ---------------- Import / Export ---------------- */
  function exportAll(){
    var payload = { version:1, exportedAt: new Date().toISOString(), programs: state.programs };
    downloadJSON(payload, "recon-board-export-" + new Date().toISOString().slice(0,10) + ".json");
    toast("Exported JSON file", "download");
  }
  function downloadJSON(obj, filename){
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
  function normalizeImported(programs){
    return programs.map(function(p){
      var base = blankProgram();
      var merged = Object.assign(base, p);
      merged.recon = Object.assign(freshRecon(), p.recon || {});
      merged.reconNotes = Object.assign(freshReconNotes(), p.reconNotes || {});
      merged.findings = Array.isArray(p.findings) ? p.findings : [];
      return merged;
    });
  }
  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var incoming = Array.isArray(data) ? data : (data.programs || []);
        if(!Array.isArray(incoming) || incoming.length === 0){ toast("No programs found in that file", "alert"); return; }
        var replace = confirm("Import "+incoming.length+" program(s).\n\nOK = replace all current data with this file.\nCancel = add these as new programs alongside what you already have.");
        var normalized = normalizeImported(incoming);
        if(replace){ state.programs = normalized; }
        else{ normalized.forEach(function(p){ p.id = uid(); }); state.programs = state.programs.concat(normalized); }
        state.selectedId = null;
        save();
        render();
        toast("Import complete", "upload");
      }catch(e){ toast("Could not read that file — invalid JSON", "alert"); }
    };
    reader.readAsText(file);
  }

  /* ---------------- Mobile sidebar ---------------- */
  function closeMobileSidebar(){ document.body.classList.remove("sidebar-open"); }

  /* ---------------- Wire up static controls ---------------- */
  renderChrome();
  document.getElementById("newProgramBtn").addEventListener("click", function(){ openProgramForm(null); });
  document.getElementById("exportAllBtn").addEventListener("click", exportAll);
  document.getElementById("importBtn").addEventListener("click", function(){ document.getElementById("importFile").click(); });
  document.getElementById("importFile").addEventListener("change", function(e){
    if(e.target.files && e.target.files[0]) handleImportFile(e.target.files[0]);
    e.target.value = "";
  });
  document.getElementById("menuToggle").addEventListener("click", function(){ document.body.classList.toggle("sidebar-open"); });
  document.getElementById("searchInput").addEventListener("input", function(e){ state.search = e.target.value; renderSidebar(); });

  /* ---------------- Render ---------------- */
  function render(){ renderSidebar(); renderMain(); }

  load();
  render();
})();
</script>
</body>
</html>
